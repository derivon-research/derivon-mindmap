[package]
name = "derivon-app"
version = "0.2.1"
description = "Derivon local authoring and route application"
edition = "2021"

[lib]
name = "derivon_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
debug-tools = [
    "tauri/tracing",
    "dep:tracing",
    "dep:tracing-chrome",
    "dep:tracing-subscriber",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
derivon-core = { git = "https://github.com/derivon-research/derivon.git", tag = "v0.2.0" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tracing = { version = "0.1", optional = true }
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
