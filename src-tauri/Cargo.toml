[package]
name = "derivon-app"
version = "0.1.0"
description = "Derivon local authoring and route application"
edition = "2021"

[lib]
name = "derivon_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
derivon-core = { git = "https://github.com/derivon-research/derivon.git", tag = "v0.1.0" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
