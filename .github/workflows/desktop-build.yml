name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  RELEASE_VERSION: "0.4.2"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-quality

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run check:release-version -- "$RELEASE_VERSION"

      - name: Test and build frontend
        run: |
          npm test
          npm run build

      - name: Check and test Rust
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  bundle-linux:
    name: Bundle Linux x64 packages
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-x86_64-unknown-linux-gnu

      - name: Install bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build desktop bundles
        env:
          NO_STRIP: "true"
        run: npm run tauri:build -- --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage -- --locked

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x86_64-packages
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/derivon-app
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

  bundle-native:
    name: Bundle ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal DMG
            platform: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64 NSIS
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

  verify-ubuntu:
    name: Ubuntu 22.04 DEB
    needs: bundle-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-x86_64-packages
          path: artifacts/linux

      - name: Verify, install, and launch DEB
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11
          deb=$(find artifacts/linux -type f -name '*.deb' -print -quit)
          scripts/ci/verify-linux-package.sh deb "$deb" "$RELEASE_VERSION"
          sudo apt-get install -y "$deb"
          scripts/ci/smoke-linux-app.sh derivon-app

  verify-fedora:
    name: Fedora 43 RPM
    needs: bundle-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-x86_64-packages
          path: artifacts/linux

      - name: Verify, install, and launch RPM in Fedora 43
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y rpm findutils util-linux dbus-x11 xorg-x11-server-Xvfb
              package=$(find artifacts/linux -type f -name "*.rpm" -print -quit)
              scripts/ci/verify-linux-package.sh rpm "$package" "$RELEASE_VERSION"
              dnf install -y "$package"
              scripts/ci/smoke-linux-app.sh derivon-app
            '

  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, bundle-linux, bundle-native, verify-ubuntu, verify-fedora]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every applicable desktop check
        env:
          EVENT: ${{ github.event_name }}
          QUALITY: ${{ needs.quality.result }}
          LINUX: ${{ needs.bundle-linux.result }}
          NATIVE: ${{ needs.bundle-native.result }}
          UBUNTU: ${{ needs.verify-ubuntu.result }}
          FEDORA: ${{ needs.verify-fedora.result }}
        run: |
          test "$QUALITY" = success
          test "$LINUX" = success
          test "$UBUNTU" = success
          test "$FEDORA" = success
          if [[ "$EVENT" == pull_request ]]; then
            test "$NATIVE" = skipped
          else
            test "$NATIVE" = success
          fi
