name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  RELEASE_VERSION: "0.4.2"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-quality

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run check:release-version -- "$RELEASE_VERSION"

      - name: Test and build frontend
        run: |
          npm test
          npm run build

      - name: Check and test Rust
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal DMG
            platform: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64 NSIS
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64 packages
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustTargets: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.target }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build desktop bundle
        env:
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Verify Linux package contents
        if: runner.os == 'Linux'
        run: |
          deb=$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -type f -name '*.deb' -print -quit)
          rpm=$(find src-tauri/target/${{ matrix.target }}/release/bundle/rpm -type f -name '*.rpm' -print -quit)
          scripts/ci/verify-linux-package.sh deb "$deb" "$RELEASE_VERSION"
          scripts/ci/verify-linux-package.sh rpm "$rpm" "$RELEASE_VERSION"

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-linux-x86_64
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/derivon-app
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm required checks passed
        env:
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$QUALITY" = success
          test "$BUILD" = success
          echo "Quality checks and all desktop bundles passed."
