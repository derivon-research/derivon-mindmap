name: Runtime performance budget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PERF_SIZE: "1000"
  PERF_RUNS: "5"

jobs:
  web-runtime-performance:
    name: Web runtime performance
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Measure runtime performance
        id: benchmark
        continue-on-error: true
        run: npm run bench:runtime

      - name: Publish performance summary
        if: always()
        run: |
          if [[ -f test-results/runtime-performance-summary.md ]]; then
            cat test-results/runtime-performance-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Web runtime benchmark did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-runtime-performance-results
          if-no-files-found: warn
          retention-days: 14
          path: test-results

      - name: Enforce performance budgets
        if: steps.benchmark.outcome != 'success'
        run: exit 1

  desktop-runtime-performance:
    name: Desktop runtime performance
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-runtime-performance

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            webkit2gtk-driver \
            xvfb

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --locked

      - name: Build desktop application
        run: npm run tauri:build -- --debug --no-bundle -- --locked

      - name: Measure runtime performance
        id: benchmark
        continue-on-error: true
        run: xvfb-run --auto-servernum npm run bench:runtime:desktop

      - name: Publish performance summary
        if: always()
        run: |
          if [[ -f test-results/desktop-runtime-performance-summary.md ]]; then
            cat test-results/desktop-runtime-performance-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Desktop runtime benchmark did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-runtime-performance-results
          if-no-files-found: warn
          retention-days: 14
          path: test-results

      - name: Enforce performance budgets
        if: steps.benchmark.outcome != 'success'
        run: exit 1
