name: Release Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a tagged main commit
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit on main." >&2
            exit 1
          fi

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use a SemVer-like vX.Y.Z format: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path src-tauri/Cargo.toml | jq -r '.packages[0].version')

          for declared in "$package_version" "$tauri_version" "$cargo_version"; do
            if [[ "$declared" != "$version" ]]; then
              echo "Tag version $version does not match declared app version $declared." >&2
              exit 1
            fi
          done

          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Release ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal DMG
            platform: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64 NSIS
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout math-reforged test workspace
        uses: actions/checkout@v6
        with:
          repository: derivon-research/math-reforged
          ref: f44fa3224437baca6b119c87c90f77eccd3595b3
          path: .ci/math-reforged

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test Rust bridge
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          DERIVON_TEST_WORKSPACE: ${{ github.workspace }}/.ci/math-reforged

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Derivon Mindmap ${{ github.ref_name }}
          releaseBody: |
            Derivon Mindmap v0.2.0 is the first stable desktop release for authoring Derivon workspaces and finding efficient learning routes.

            ## Highlights

            - Plan one route toward multiple target concepts with derivon-core v0.2.0. Shared prerequisite work is selected once and charged once.
            - Select multiple known and target concepts with fuzzy search, or use left click for known concepts and right click for targets directly on the canvas.
            - Inspect executable derivation steps, route cost, bounds, optimality, and target-specific diagnostics for unreachable goals.
            - Open, edit, validate, and automatically save local Derivon workspaces from the Tauri desktop application.
            - Author Markdown, KaTeX, tables, and interactive HTML documents alongside concepts and derivations.

            ## Downloads

            - macOS universal DMG for Apple Silicon and Intel Macs.
            - Windows x64 NSIS installer.

            The macOS and Windows packages are currently unsigned. Your operating system may show an unverified developer warning on first launch.
          releaseDraft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
