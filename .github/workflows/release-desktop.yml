name: Release Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a tagged main commit
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit on main." >&2
            exit 1
          fi

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use a SemVer-like vX.Y.Z format: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path src-tauri/Cargo.toml | jq -r '.packages[0].version')

          for declared in "$package_version" "$tauri_version" "$cargo_version"; do
            if [[ "$declared" != "$version" ]]; then
              echo "Tag version $version does not match declared app version $declared." >&2
              exit 1
            fi
          done

          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Release ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal DMG
            platform: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64 NSIS
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test Rust bridge
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Derivon Mindmap ${{ github.ref_name }}
          releaseBody: |
            Derivon Mindmap v0.2.1 improves route selection, guided onboarding, graph responsiveness, and visual focus. These notes cover the three commits merged after v0.2.0.

            ## Fixes and improvements

            - Keep fuzzy-search results open after selecting a known or target concept, so multiple route inputs can be chosen without reopening the search.
            - Complete guided-onboarding steps from the Next action while preserving titles, descriptions, concept names, and derivation weights already entered by the user.
            - Refine the onboarding Skip and Next presentation, and rebuild desktop icons with true transparency to remove dark edges in the macOS Dock.
            - Move route solving, workspace I/O, and revision hashing off the Tauri UI thread; use lightweight revision checks, pause polling during canvas interaction or while backgrounded, and render only visible graph elements.
            - Keep large route results responsive with React transitions and dedicated regression coverage for large workspaces and long routes.
            - Make edges passive and low-opacity by default, highlight the neighborhood of the hovered concept or derivation, keep focused and routed nodes fully visible and correctly stacked, and prevent dimmed nodes from intercepting interaction.

            ## Test stability

            - Replace the changing external math-reforged test checkout with a repository-local A/B/C/D/X/Y workspace fixture used by Rust and desktop release tests.

            ## Downloads

            - macOS universal DMG for Apple Silicon and Intel Macs.
            - Windows x64 NSIS installer.

            The macOS and Windows packages are currently unsigned. Your operating system may show an unverified developer warning on first launch.

            **Full Changelog**: https://github.com/derivon-research/derivon-mindmap/compare/v0.2.0...v0.2.1
          releaseDraft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
